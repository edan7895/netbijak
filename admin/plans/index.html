<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Plans | NetBijak Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="../admin.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .admin-page { max-width: 72rem; margin: 0 auto; padding: 2rem 1.5rem; }
    .admin-page-topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem; color: #fff; flex-wrap: wrap; gap: 1rem;
    }
    .admin-page-topbar h1 { font-size: 1.3rem; font-weight: 800; }
    .admin-back-link { color: #94a3b8; text-decoration: none; font-size: 0.85rem; }
    .admin-filter-bar { display: flex; gap: 12px; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .admin-filter-bar select {
      padding: 10px 14px; border-radius: 10px; border: none; font-size: 0.875rem;
    }
    .btn-new {
      padding: 10px 20px; background: #14b8a6; color: #fff; border: none;
      border-radius: 10px; font-weight: 700; font-size: 0.875rem; cursor: pointer;
    }
    .admin-table-wrap {
      background: #fff; border-radius: 16px; overflow: hidden; overflow-x: auto;
    }
    table.admin-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    table.admin-table th {
      background: #f8fafc; padding: 12px 16px; text-align: left; font-weight: 700; color: #475569;
    }
    table.admin-table td { padding: 12px 16px; border-top: 1px solid #f1f5f9; }
    .btn-small {
      padding: 6px 14px; background: #0f172a; color: #fff; border: none;
      border-radius: 8px; font-size: 0.8rem; cursor: pointer;
    }
    .badge-published { background: #dcfce7; color: #166534; padding: 3px 10px; border-radius: 99px; font-size: 0.75rem; font-weight: 700; }
    .badge-unpublished { background: #fee2e2; color: #991b1b; padding: 3px 10px; border-radius: 99px; font-size: 0.75rem; font-weight: 700; }

    #plan-form-wrap {
      background: #fff; border-radius: 16px; padding: 1.75rem; margin-bottom: 1.5rem;
    }
    #plan-form-wrap h2 { margin-bottom: 1.25rem; font-size: 1.15rem; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
    .form-field { margin-bottom: 1rem; }
    .form-field.full-width { grid-column: 1 / -1; }
    .form-field label {
      display: block; font-size: 0.8rem; font-weight: 700; color: #475569; margin-bottom: 6px;
    }
    .form-field input, .form-field select, .form-field textarea {
      width: 100%; padding: 10px 14px; border-radius: 8px; border: 1.5px solid #cbd5e1; font-size: 0.9rem;
    }
    .form-field textarea { min-height: 80px; resize: vertical; }
    .form-checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 1rem; }
    .form-actions { display: flex; gap: 10px; margin-top: 1.25rem; }
    .btn-save {
      padding: 12px 28px; background: #14b8a6; color: #fff; border: none;
      border-radius: 10px; font-weight: 700; cursor: pointer;
    }
    .btn-cancel {
      padding: 12px 28px; background: #f1f5f9; color: #334155; border: none;
      border-radius: 10px; font-weight: 700; cursor: pointer;
    }

    .banners-section { margin-top: 1.5rem; border-top: 2px solid #f1f5f9; padding-top: 1.25rem; }
    .banners-section h3 { font-size: 1rem; margin-bottom: 0.75rem; }
    .banner-row {
      display: grid; grid-template-columns: 2fr 2fr 1fr 1fr 1fr auto; gap: 8px;
      align-items: center; margin-bottom: 10px; background: #f8fafc; padding: 10px; border-radius: 10px;
    }
    @media (max-width: 900px) { .banner-row { grid-template-columns: 1fr; } }
    .banner-row input[type="text"], .banner-row input[type="datetime-local"] {
      padding: 8px 10px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 0.8rem;
    }
    .banner-active-label { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; }
    .btn-remove-banner {
      background: #fee2e2; color: #991b1b; border: none; border-radius: 6px;
      width: 28px; height: 28px; cursor: pointer;
    }
    .btn-add-banner {
      padding: 8px 16px; background: #e0f2fe; color: #0369a1; border: none;
      border-radius: 8px; font-size: 0.8rem; font-weight: 700; cursor: pointer;
    }
    .ai-overview-section, .promo-section {
      margin-top: 1.5rem; border-top: 2px solid #f1f5f9; padding-top: 1.25rem;
    }
    .ai-overview-section h3, .promo-section h3 { font-size: 1rem; margin-bottom: 0.5rem; }
    .form-hint { font-size: 0.75rem; color: #94a3b8; margin-bottom: 10px; }
  </style>
</head>
<body>

  <div class="admin-page">
    <div class="admin-page-topbar">
      <div>
        <a href="../" class="admin-back-link">← Back to Admin</a>
        <h1>Manage Plans</h1>
      </div>
      <div style="display:flex; align-items:center; gap:14px;">
        <span class="admin-email-tag" id="admin-email-display"></span>
        <button id="admin-logout-btn" class="admin-logout-btn">Sign Out</button>
      </div>
    </div>

    <!-- 新增/编辑表单 -->
    <div id="plan-form-wrap" class="hidden">
      <h2 id="plan-form-title">New Plan</h2>
      <form id="plan-form">
        <div class="form-grid">
          <div class="form-field">
            <label>Provider</label>
            <select id="form-provider-id" required></select>
          </div>
          <div class="form-field">
            <label>Plan Name</label>
            <input type="text" id="form-name" required />
          </div>
          <div class="form-field">
            <label>Tagline</label>
            <input type="text" id="form-tagline" />
          </div>
          <div class="form-field">
            <label>Application Type (New Application / Transfer Request / Upgrade from Streamyx / etc.)</label>
            <input type="text" id="form-app-type" />
          </div>
          <div class="form-field">
            <label>Download Speed</label>
            <input type="text" id="form-download-speed" placeholder="e.g. 100Mbps" />
          </div>
          <div class="form-field">
            <label>Upload Speed</label>
            <input type="text" id="form-upload-speed" placeholder="e.g. 50Mbps" />
          </div>
          <div class="form-field">
            <label>Promo Price (RM)</label>
            <input type="number" step="0.01" id="form-promo-price" required />
          </div>
          <div class="form-field">
            <label>Original Price (RM, optional)</label>
            <input type="number" step="0.01" id="form-original-price" />
          </div>
          <div class="form-field">
            <label>Contract (months)</label>
            <input type="number" id="form-contract-months" />
          </div>
          <div class="form-field">
            <label>Recommended For (e.g. "2-4 users/devices")</label>
            <input type="text" id="form-recommended-for" />
          </div>
          <div class="form-field full-width">
            <label>Housing Type Description</label>
            <input type="text" id="form-housing-type" />
          </div>
          <div class="form-field full-width">
            <label>Features (comma separated)</label>
            <textarea id="form-features"></textarea>
          </div>
          <div class="form-field full-width">
            <label>WhatsApp Message Template</label>
            <textarea id="form-whatsapp-ref"></textarea>
          </div>
          <div class="form-field">
            <label>SEO Title</label>
            <input type="text" id="form-seo-title" />
          </div>
          <div class="form-field">
            <label>SEO Description</label>
            <input type="text" id="form-seo-description" />
          </div>
          <div class="form-field">
            <label>Publish At (leave blank = immediately)</label>
            <input type="datetime-local" id="form-publish-at" />
          </div>
          <div class="form-field">
            <label>Unpublish At (leave blank = never)</label>
            <input type="datetime-local" id="form-unpublish-at" />
          </div>
        </div>

        <div class="form-checkbox-row">
          <input type="checkbox" id="form-is-published" />
          <label for="form-is-published">Published (visible on website)</label>
        </div>

        <div class="ai-overview-section">
          <h3>NetBijak's Take (AI-generated, editable)</h3>
          <p class="form-hint">Leave empty to let the system auto-generate one. Once filled (by AI or manually), it will not be overwritten automatically.</p>
          <textarea id="form-ai-overview" rows="4" placeholder="Auto-generated on next data sync if left empty..."></textarea>
        </div>

        <div class="promo-section">
          <div class="form-checkbox-row">
            <input type="checkbox" id="form-promo-enabled" />
            <label for="form-promo-enabled">Enable Promotion / Gift Section</label>
          </div>
          <div id="promo-fields-wrap" class="hidden">
            <div class="form-field">
              <label>Promo Image File Name (e.g. earbudsamsung.png — must be uploaded to assets/images/promos/)</label>
              <input type="text" id="form-promo-image-name" placeholder="e.g. earbudsamsung.png" />
            </div>
            <div class="form-field">
              <label>Promo Text</label>
              <textarea id="form-promo-text" placeholder="e.g. Free Samsung Galaxy Buds worth RM399 when you sign up!"></textarea>
            </div>
          </div>
        </div>

        <div class="banners-section">
          <h3>Promotional Banners</h3>
          <div id="banners-list"></div>
          <button type="button" id="btn-add-banner" class="btn-add-banner">+ Add Banner</button>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-save">Save Plan</button>
          <button type="button" id="btn-cancel-form" class="btn-cancel">Cancel</button>
        </div>
      </form>
    </div>

    <div class="admin-filter-bar">
      <select id="filter-provider"></select>
      <button id="btn-new-plan" class="btn-new">+ New Plan</button>
    </div>

    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Provider</th>
            <th>Plan Name</th>
            <th>Price</th>
            <th>App Type</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="plans-table-body"></tbody>
      </table>
    </div>
  </div>

  <script src="../../assets/js/supabase-client.js"></script>
  <script src="../../assets/js/admin-auth.js"></script>
  <script src="../../assets/js/admin-plans.js"></script>
</body>
</html>
