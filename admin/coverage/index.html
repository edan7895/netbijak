<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Coverage | NetBijak Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="../admin.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .admin-page { max-width: 48rem; margin: 0 auto; padding: 2rem 1.5rem; }
    .admin-page-topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem; color: #fff; flex-wrap: wrap; gap: 1rem;
    }
    .admin-page-topbar h1 { font-size: 1.3rem; font-weight: 800; }
    .admin-back-link { color: #94a3b8; text-decoration: none; font-size: 0.85rem; }

    .admin-card {
      background: #fff; border-radius: 16px; padding: 1.75rem; margin-bottom: 1.5rem;
    }
    .admin-card h2 { font-size: 1.05rem; margin-bottom: 1rem; }
    .search-row { display: flex; gap: 10px; }
    .search-row input {
      flex: 1; padding: 12px 14px; border-radius: 10px; border: 1.5px solid #cbd5e1; font-size: 1rem;
    }
    .search-row button {
      padding: 12px 24px; background: #14b8a6; color: #fff; border: none;
      border-radius: 10px; font-weight: 700; cursor: pointer;
    }

    .postcode-confirm-box {
      margin-top: 1rem; padding: 12px 16px; background: #f0fdfa;
      border: 1.5px solid #14b8a6; border-radius: 10px; font-weight: 700; color: #0d9488;
    }

    #location-section { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1.5px solid #f1f5f9; }
    .form-field { margin-bottom: 1rem; }
    .form-field label { display: block; font-size: 0.8rem; font-weight: 700; color: #475569; margin-bottom: 6px; }
    .form-field select, .form-field input {
      width: 100%; padding: 10px 14px; border-radius: 8px; border: 1.5px solid #cbd5e1; font-size: 0.9rem;
    }

    .add-location-row { display: flex; gap: 10px; align-items: flex-end; }
    .add-location-row .form-field { flex: 1; margin-bottom: 0; }
    .add-location-row select { width: 140px; }
    .btn-add-location {
      padding: 10px 18px; background: #0f172a; color: #fff; border: none;
      border-radius: 8px; font-weight: 700; cursor: pointer; white-space: nowrap;
    }

    #coverage-checkboxes-wrap {
      margin: 1.25rem 0; display: flex; flex-direction: column; gap: 10px;
    }
    .coverage-checkbox-row {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      background: #f8fafc; border-radius: 10px; cursor: pointer;
    }
    .coverage-checkbox-row input { width: 18px; height: 18px; }
    .coverage-provider-logo { height: 24px; width: auto; }

    .btn-save-coverage {
      padding: 12px 28px; background: #14b8a6; color: #fff; border: none;
      border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%;
    }

    .hidden { display: none !important; }

    .osm-suggestion-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .osm-suggestion-btn {
      padding: 6px 12px; background: #e0f2fe; color: #0369a1; border: none;
      border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
    }
    .osm-suggestion-btn:hover { background: #bae6fd; }
  </style>
</head>
<body>

  <div class="admin-page">
    <div class="admin-page-topbar">
      <div>
        <a href="../" class="admin-back-link">← Back to Admin</a>
        <h1>Manage Coverage</h1>
      </div>
      <div style="display:flex; align-items:center; gap:14px;">
        <span class="admin-email-tag" id="admin-email-display"></span>
        <button id="admin-logout-btn" class="admin-logout-btn">Sign Out</button>
      </div>
    </div>

    <div class="admin-card">
      <h2>Step 1: Search Postcode</h2>
      <div class="search-row">
        <input type="text" id="postcode-search-input" placeholder="e.g. 52200" maxlength="5" />
        <button id="postcode-search-btn">Search</button>
      </div>
      <div id="postcode-result-box"></div>
    </div>

    <div class="admin-card hidden" id="location-section">
      <h2>Step 2: Select or Add a Taman / Condo</h2>

      <div class="form-field">
        <label>Existing Locations in This Postcode</label>
        <select id="location-select"></select>
      </div>

      <div id="osm-suggestions-wrap" class="hidden" style="margin-top:1rem"></div>

      <p style="font-size:0.8rem; color:#94a3b8; margin:1rem 0 0.5rem">Or add a new one manually:</p>
      <div class="add-location-row">
        <div class="form-field">
          <label>Name</label>
          <input type="text" id="new-location-name" placeholder="e.g. Residensi Menjalara" />
        </div>
        <div class="form-field">
          <label>Type</label>
          <select id="new-location-type">
            <option value="both">Both</option>
            <option value="landed">Landed</option>
            <option value="highrise">High-rise</option>
          </select>
        </div>
        <button id="btn-add-location" class="btn-add-location">+ Add</button>
      </div>

      <div id="coverage-checkboxes-wrap" class="hidden"></div>

      <button id="btn-save-coverage" class="btn-save-coverage">Save Coverage</button>
    </div>
  </div>

  <script src="../../assets/js/supabase-client.js"></script>
  <script src="../../assets/js/admin-auth.js"></script>
  <script src="../../assets/js/admin-coverage.js"></script>
</body>
</html>
