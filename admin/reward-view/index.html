<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reward Customers | NetBijak Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="../admin.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .admin-page { max-width: 80rem; margin: 0 auto; padding: 2rem 1.5rem; }
    .admin-page-topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem; color: #fff; flex-wrap: wrap; gap: 1rem;
    }
    .admin-page-topbar h1 { font-size: 1.3rem; font-weight: 800; }
    .admin-back-link { color: #94a3b8; text-decoration: none; font-size: 0.85rem; }
    .admin-card { background: #fff; border-radius: 16px; padding: 1.75rem; }
    #customer-count-label { font-size: 0.85rem; color: #64748b; font-weight: 700; margin-bottom: 1rem; }
    .admin-table-wrap { overflow-x: auto; }
    table.admin-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    table.admin-table th {
      background: #f8fafc; padding: 10px 14px; text-align: left; font-weight: 700; color: #475569; white-space: nowrap;
    }
    table.admin-table td { padding: 10px 14px; border-top: 1px solid #f1f5f9; white-space: nowrap; }
    .badge-ok { background: #dcfce7; color: #166534; padding: 3px 10px; border-radius: 99px; font-size: 0.72rem; font-weight: 700; }
    .badge-soon { background: #fef3c7; color: #92400e; padding: 3px 10px; border-radius: 99px; font-size: 0.72rem; font-weight: 700; }
    .badge-neutral { background: #f1f5f9; color: #64748b; padding: 3px 10px; border-radius: 99px; font-size: 0.72rem; font-weight: 700; }
    .badge-excluded { background: #f3e8ff; color: #7c3aed; padding: 3px 10px; border-radius: 99px; font-size: 0.72rem; font-weight: 700; }
  </style>
</head>
<body>

  <div class="admin-page">
    <div class="admin-page-topbar">
      <div>
        <a href="../rewards/" class="admin-back-link">← Back to Rewards</a>
        <h1 id="page-title">Reward Customers</h1>
      </div>
      <div style="display:flex; align-items:center; gap:14px;">
        <span class="admin-email-tag" id="admin-email-display"></span>
        <button id="admin-logout-btn" class="admin-logout-btn">Sign Out</button>
      </div>
    </div>

    <div class="admin-card">
      <p style="font-size:0.85rem; color:#94a3b8; margin-bottom:1rem">To register a new customer for this event, go to <a href="../customers/">Manage Customers</a> and select this event in the reward section.</p>
      <div id="customer-count-label"></div>
      <div style="display:flex; gap:10px; margin-bottom:1rem">
        <button id="btn-select-all" class="btn-small" style="background:#f1f5f9;color:#334155">Select/Deselect All</button>
        <button id="btn-queue-selected" class="btn-small" style="background:#14b8a6">Queue Selected for TNG Send →</button>
      </div>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th></th>
              <th>Name</th>
              <th>Email</th>
              <th>IC (last 2 shown)</th>
              <th>Plan</th>
              <th>Installation</th>
              <th>Status</th>
              <th>Exclude?</th>
            </tr>
          </thead>
          <tbody id="reward-customers-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="../../assets/js/supabase-client.js"></script>
  <script src="../../assets/js/admin-auth.js"></script>
  <script src="../../assets/js/admin-reward-view.js"></script>
</body>
</html>
