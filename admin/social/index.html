<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social Media | NetBijak Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="../admin.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .admin-page { max-width: 60rem; margin: 0 auto; padding: 2rem 1.5rem; }
    .admin-page-topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem; color: #fff; flex-wrap: wrap; gap: 1rem;
    }
    .admin-page-topbar h1 { font-size: 1.3rem; font-weight: 800; }
    .admin-back-link { color: #94a3b8; text-decoration: none; font-size: 0.85rem; }

    .filter-status-buttons { display: flex; gap: 8px; margin-bottom: 1.25rem; }
    .filter-status-btn {
      padding: 8px 18px; background: #f1f5f9; color: #334155; border: none;
      border-radius: 8px; font-size: 0.85rem; font-weight: 700; cursor: pointer;
    }
    .filter-status-btn.active { background: #14b8a6; color: #fff; }

    .social-article-card {
      background: #fff; border-radius: 16px; padding: 1.5rem; margin-bottom: 1.25rem;
    }
    .social-article-header { display: flex; align-items: center; gap: 10px; margin-bottom: 0.75rem; }
    .social-article-header h3 { font-size: 1rem; margin: 0; }
    .lang-tag { background: #e0f2fe; color: #0369a1; padding: 3px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; flex-shrink: 0; }

    .social-caption-preview {
      background: #f8fafc; padding: 1rem; border-radius: 10px; font-size: 0.9rem;
      color: #334155; line-height: 1.6; white-space: pre-wrap; margin-bottom: 1rem;
    }

    .social-cards-row { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 1rem; padding-bottom: 4px; }
    .social-card-thumb-link { flex-shrink: 0; }
    .social-card-thumb {
      width: 90px; height: 90px; object-fit: cover; border-radius: 8px; border: 1.5px solid #e2e8f0;
    }

    .social-actions-row { margin-bottom: 1rem; }
    .btn-copy-caption {
      padding: 10px 20px; background: #14b8a6; color: #fff; border: none;
      border-radius: 8px; font-weight: 700; font-size: 0.85rem; cursor: pointer;
    }

    .social-checkbox-row { display: flex; gap: 1.5rem; flex-wrap: wrap; }
    .social-checkbox-row label {
      display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #475569; cursor: pointer;
    }
    .social-checkbox-row input { width: 16px; height: 16px; }
  </style>
</head>
<body>

  <div class="admin-page">
    <div class="admin-page-topbar">
      <div>
        <a href="../" class="admin-back-link">← Back to Admin</a>
        <h1>Social Media</h1>
      </div>
      <div style="display:flex; align-items:center; gap:14px;">
        <span class="admin-email-tag" id="admin-email-display"></span>
        <button id="admin-logout-btn" class="admin-logout-btn">Sign Out</button>
      </div>
    </div>

    <div class="filter-status-buttons">
      <button class="filter-status-btn active" data-status="pending">Pending</button>
      <button class="filter-status-btn" data-status="done">Fully Posted</button>
      <button class="filter-status-btn" data-status="all">All</button>
    </div>

    <div id="social-list-wrap"></div>
  </div>

  <script src="../../assets/js/supabase-client.js"></script>
  <script src="../../assets/js/admin-auth.js"></script>
  <script src="../../assets/js/admin-social.js"></script>
</body>
</html>
