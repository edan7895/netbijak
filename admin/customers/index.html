<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Customers | NetBijak Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="../admin.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .admin-page { max-width: 72rem; margin: 0 auto; padding: 2rem 1.5rem; }
    .admin-page-topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem; color: #fff; flex-wrap: wrap; gap: 1rem;
    }
    .admin-page-topbar h1 { font-size: 1.3rem; font-weight: 800; }
    .admin-back-link { color: #94a3b8; text-decoration: none; font-size: 0.85rem; }
    .admin-filter-bar { display: flex; gap: 12px; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .admin-filter-bar select {
      padding: 10px 14px; border-radius: 10px; border: none; font-size: 0.875rem;
    }
    .btn-new {
      padding: 10px 20px; background: #14b8a6; color: #fff; border: none;
      border-radius: 10px; font-weight: 700; font-size: 0.875rem; cursor: pointer;
    }
    .admin-table-wrap {
      background: #fff; border-radius: 16px; overflow: hidden; overflow-x: auto;
    }
    table.admin-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    table.admin-table th {
      background: #f8fafc; padding: 12px 16px; text-align: left; font-weight: 700; color: #475569;
      white-space: nowrap;
    }
    table.admin-table td { padding: 12px 16px; border-top: 1px solid #f1f5f9; white-space: nowrap; }
    .btn-small {
      padding: 6px 14px; background: #0f172a; color: #fff; border: none;
      border-radius: 8px; font-size: 0.8rem; cursor: pointer;
    }
    .btn-whatsapp-small {
      display: inline-block; padding: 6px 14px; background: #25D366; color: #fff;
      border-radius: 8px; font-size: 0.8rem; font-weight: 700; text-decoration: none;
    }
    .badge-overdue { background: #fee2e2; color: #991b1b; padding: 3px 10px; border-radius: 99px; font-size: 0.75rem; font-weight: 700; }
    .badge-soon { background: #fef3c7; color: #92400e; padding: 3px 10px; border-radius: 99px; font-size: 0.75rem; font-weight: 700; }
    .badge-ok { background: #dcfce7; color: #166534; padding: 3px 10px; border-radius: 99px; font-size: 0.75rem; font-weight: 700; }
    .badge-neutral { background: #f1f5f9; color: #64748b; padding: 3px 10px; border-radius: 99px; font-size: 0.75rem; font-weight: 700; }

    #customer-form-wrap {
      background: #fff; border-radius: 16px; padding: 1.75rem; margin-bottom: 1.5rem;
    }
    #customer-form-wrap h2 { margin-bottom: 1.25rem; font-size: 1.15rem; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
    .form-field { margin-bottom: 1rem; }
    .form-field.full-width { grid-column: 1 / -1; }
    .form-field label {
      display: block; font-size: 0.8rem; font-weight: 700; color: #475569; margin-bottom: 6px;
    }
    .form-field input, .form-field select, .form-field textarea {
      width: 100%; padding: 10px 14px; border-radius: 8px; border: 1.5px solid #cbd5e1; font-size: 0.9rem;
    }
    .form-field textarea { min-height: 80px; resize: vertical; }
    .form-hint { font-size: 0.75rem; color: #94a3b8; margin-top: 4px; }
    .form-checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 1rem; }
    .form-actions { display: flex; gap: 10px; margin-top: 1.25rem; }
    .btn-save {
      padding: 12px 28px; background: #14b8a6; color: #fff; border: none;
      border-radius: 10px; font-weight: 700; cursor: pointer;
    }
    .btn-cancel {
      padding: 12px 28px; background: #f1f5f9; color: #334155; border: none;
      border-radius: 10px; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="admin-page">
    <div class="admin-page-topbar">
      <div>
        <a href="../" class="admin-back-link">← Back to Admin</a>
        <h1>Manage Customers</h1>
      </div>
      <div style="display:flex; align-items:center; gap:14px;">
        <span class="admin-email-tag" id="admin-email-display"></span>
        <button id="admin-logout-btn" class="admin-logout-btn">Sign Out</button>
      </div>
    </div>

    <!-- 新增/编辑表单 -->
    <div id="customer-form-wrap" class="hidden">
      <h2 id="customer-form-title-label">New Customer</h2>
      <form id="customer-form">
        <div class="form-grid">
          <div class="form-field">
            <label>Customer Name</label>
            <input type="text" id="form-customer-name" required />
          </div>
          <div class="form-field">
            <label>Phone Number</label>
            <input type="text" id="form-customer-phone" placeholder="e.g. 0123456789" required />
            <p class="form-hint">Enter Malaysia number, e.g. 0123456789 — will auto-convert for WhatsApp.</p>
          </div>
          <div class="form-field">
            <label>Subscribed Plan</label>
            <select id="form-customer-plan-id" required></select>
          </div>
          <div class="form-field">
            <label>Signup Date</label>
            <input type="date" id="form-customer-signup-date" />
          </div>
          <div class="form-field">
            <label>Contract End Date</label>
            <input type="date" id="form-customer-end-date" />
          </div>
          <div class="form-field full-width">
            <label>Notes</label>
            <textarea id="form-customer-notes"></textarea>
          </div>
        </div>

        <div class="form-checkbox-row">
          <input type="checkbox" id="form-customer-reminder-sent" />
          <label for="form-customer-reminder-sent">Reminder already sent</label>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-save">Save Customer</button>
          <button type="button" id="btn-cancel-customer-form" class="btn-cancel">Cancel</button>
        </div>
      </form>
    </div>

    <div class="admin-filter-bar">
      <select id="filter-expiry">
        <option value="all">All Customers</option>
        <option value="30" selected>Expiring within 30 days</option>
        <option value="overdue">Overdue</option>
      </select>
      <button id="btn-new-customer" class="btn-new">+ New Customer</button>
    </div>

    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Plan</th>
            <th>Contract End</th>
            <th>Status</th>
            <th>Remind</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="customers-table-body"></tbody>
      </table>
    </div>
  </div>

  <script src="../../assets/js/supabase-client.js"></script>
  <script src="../../assets/js/admin-auth.js"></script>
  <script src="../../assets/js/admin-customers.js"></script>
</body>
</html>
