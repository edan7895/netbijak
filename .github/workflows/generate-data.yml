name: Generate Static Data

on:
  schedule:
    # 马来西亚 00:00 = UTC 16:00(前一天)
    - cron: '0 16 * * *'
    # 马来西亚 08:00 = UTC 00:00
    - cron: '0 0 * * *'
    # 马来西亚 16:00 = UTC 08:00
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate data
        run: node scripts/generate-data.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Generate plan pages
        run: node scripts/generate-plan-pages.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ */*/index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update static data"
          git push