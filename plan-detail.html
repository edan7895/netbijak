<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netbijak.com - 配套详情</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

  <header class="bg-white shadow-sm border-b sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="text-2xl font-black text-blue-600">⚡ Netbijak<span class="text-orange-500">.com</span></a>
      <select id="lang-selector" onchange="setLanguage(this.value)" class="bg-gray-100 border p-2 rounded-lg text-xs font-bold">
        <option value="zh">中文</option>
        <option value="en">English</option>
        <option value="ms">Bahasa Melayu</option>
      </select>
    </div>
  </header>

  <main class="flex-grow max-w-4xl mx-auto px-4 py-10 w-full">
    <a href="javascript:history.back()" class="inline-block text-sm text-blue-600 font-semibold mb-6 hover:underline" data-i18n="back_to_list">← 返回配套列表</a>

    <div id="detail-card" class="bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100 p-8">
      <div class="text-center py-12 text-gray-400">正在获取配套详情...</div>
    </div>
  </main>

  <footer class="bg-gray-900 text-gray-400 py-8 text-center text-sm" data-i18n="footer_rights">
    © 2026 Netbijak.com. 版权所有。
  </footer>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initSupabase();
      const urlParams = new URLSearchParams(window.location.search);
      const planId = urlParams.get('id');
      if (planId) fetchPlanDetail(planId);
    });

    async function fetchPlanDetail(id) {
      const container = document.getElementById('detail-card');
      const { data: plan, error } = await supabaseClient.from('plans').select('*').eq('id', id).single();

      if (error || !plan) {
        container.innerHTML = `<div class="text-center text-red-500 py-8">找不到该配套的信息。</div>`;
        return;
      }

      const dl = formatSpeed(plan.download_speed);
      const ul = formatSpeed(plan.upload_speed);
      const waMsg = encodeURIComponent(plan.whatsapp_ref || `Hi Netbijak, I want to apply for ${plan.name} (RM${plan.promo_price}/m)`);
      const waUrl = `https://wa.me/60123456789?text=${waMsg}`;

      container.innerHTML = `
        <div class="flex flex-col md:flex-row justify-between items-start border-b pb-6 mb-6 gap-4">
          <div>
            <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full uppercase">${plan.provider}</span>
            <h1 class="text-3xl font-black text-gray-900 mt-2">${plan.name}</h1>
            ${plan.tagline ? `<p class="text-red-500 font-bold text-sm mt-1">🔥 ${plan.tagline}</p>` : ''}
          </div>
          <div class="text-left md:text-right bg-blue-50 p-4 rounded-2xl w-full md:w-auto">
            <div class="text-xs text-gray-500">月费 (Monthly Fee)</div>
            <div class="text-4xl font-extrabold text-blue-600">RM ${plan.promo_price}</div>
            ${plan.original_price ? `<div class="text-xs text-gray-400 line-through">RM ${plan.original_price}</div>` : ''}
          </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8 text-center">
          <div class="p-4 bg-gray-50 rounded-2xl">
            <div class="text-xs text-gray-400" data-i18n="speed">下载网速</div>
            <div class="text-xl font-bold text-gray-800">${dl.number} ${dl.unit}</div>
          </div>
          <div class="p-4 bg-gray-50 rounded-2xl">
            <div class="text-xs text-gray-400" data-i18n="upload_speed">上传网速</div>
            <div class="text-xl font-bold text-gray-800">${ul.number} ${ul.unit}</div>
          </div>
          <div class="p-4 bg-gray-50 rounded-2xl col-span-2 md:col-span-1">
            <div class="text-xs text-gray-400" data-i18n="contract">合约期限</div>
            <div class="text-xl font-bold text-gray-800">${plan.contract_months || 24} 个月</div>
          </div>
        </div>

        ${plan.features ? `
          <div class="mb-6">
            <h3 class="text-lg font-bold text-gray-900 mb-3" data-i18n="features_title">配套亮点与服务</h3>
            <ul class="space-y-2 text-gray-700">
              ${plan.features.split(',').map(f => `<li class="flex items-center gap-2"><span class="text-green-500 font-bold">✓</span> ${f.trim()}</li>`).join('')}
            </ul>
          </div>
        ` : ''}

        ${plan.recommended_for ? `
          <div class="mb-6 p-4 bg-amber-50 border border-amber-200 rounded-2xl text-amber-900 text-sm">
            <strong>💡 <span data-i18n="recommended_title">适用人群</span>：</strong> ${plan.recommended_for}
          </div>
        ` : ''}

        <div class="mt-8 pt-6 border-t">
          <a href="${waUrl}" target="_blank" class="block w-full text-center bg-green-500 hover:bg-green-600 text-white text-lg font-bold py-4 rounded-2xl shadow-lg transition">
            💬 立即在 WhatsApp 申请/咨询
          </a>
        </div>
      `;

      updatePageLanguage();
    }
  </script>
</body>
</html>
