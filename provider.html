<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netbijak.com - 运营商配套</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

  <header class="bg-white shadow-sm border-b sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="text-2xl font-black text-blue-600">⚡ Netbijak<span class="text-orange-500">.com</span></a>
      <select id="lang-selector" onchange="setLanguage(this.value)" class="bg-gray-100 border p-2 rounded-lg text-xs font-bold">
        <option value="zh">中文</option>
        <option value="en">English</option>
        <option value="ms">Bahasa Melayu</option>
      </select>
    </div>
  </header>

  <main class="flex-grow">
    <section class="bg-gradient-to-r from-orange-500 to-red-600 text-white py-12 px-4 text-center">
      <div class="max-w-4xl mx-auto">
        <h1 id="provider-title" class="text-3xl md:text-5xl font-black">Broadband Plans</h1>
        <p class="mt-2 text-orange-100">Netbijak.com 品牌专页 — 查看最全最新配套与优惠折扣</p>
      </div>
    </section>

    <section class="max-w-7xl mx-auto px-4 py-12">
      <div id="plans-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <div class="col-span-full text-center py-12 text-gray-400">正在调取配套数据...</div>
      </div>
    </section>
  </main>

  <footer class="bg-gray-900 text-gray-400 py-8 text-center text-sm" data-i18n="footer_rights">
    © 2026 Netbijak.com. 版权所有。
  </footer>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initSupabase();
      const urlParams = new URLSearchParams(window.location.search);
      const providerName = urlParams.get('p') || 'Unifi';
      document.getElementById('provider-title').innerText = `${providerName} Broadband Plans`;
      fetchProviderPlans(providerName);
    });

    async function fetchProviderPlans(provider) {
      const container = document.getElementById('plans-container');
      let { data: plans, error } = await supabaseClient
        .from('plans')
        .select('*')
        .ilike('provider', `%${provider}%`);

      if (error || !plans || plans.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12">未找到 ${provider} 的相关配套。</div>`;
        return;
      }

      container.innerHTML = plans.map(plan => {
        const dl = formatSpeed(plan.download_speed);
        const waMsg = encodeURIComponent(plan.whatsapp_ref || `Hi Netbijak, I want to inquire about ${plan.name}`);
        const waUrl = `https://wa.me/60123456789?text=${waMsg}`;

        return `
          <div class="bg-white rounded-2xl shadow-md hover:shadow-xl transition border border-gray-100 flex flex-col justify-between overflow-hidden">
            ${plan.tagline ? `<div class="bg-orange-500 text-white text-xs font-bold px-3 py-1 text-center uppercase">${plan.tagline}</div>` : ''}
            <div class="p-6">
              <h3 class="text-xl font-bold text-gray-900 mb-4">${plan.name}</h3>
              <div class="my-4 p-4 bg-orange-50 rounded-xl flex justify-between items-center">
                <div>
                  <div class="text-xs text-gray-500 font-semibold" data-i18n="speed">下载网速</div>
                  <div class="text-2xl font-black text-orange-600">${dl.number} <span class="text-sm font-bold">${dl.unit}</span></div>
                </div>
                <div class="text-right">
                  <div class="text-3xl font-extrabold text-gray-900">RM ${plan.promo_price}</div>
                  <div class="text-xs text-gray-500">/<span data-i18n="mth">月</span></div>
                </div>
              </div>
            </div>
            <div class="p-6 pt-0 space-y-2">
              <a href="plan-detail.html?id=${plan.id}" class="block w-full text-center bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-2.5 rounded-xl text-sm" data-i18n="btn_view_detail">查看详情</a>
              <a href="${waUrl}" target="_blank" class="block w-full text-center bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-xl" data-i18n="btn_apply">💬 立即申请 (WhatsApp)</a>
            </div>
          </div>
        `;
      }).join('');

      updatePageLanguage();
    }
  </script>
</body>
</html>
