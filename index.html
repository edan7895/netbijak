<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NetBijak - 宽带比价专家</title>
  <link rel="stylesheet" href="style.css" />
  <!-- 加载 Supabase SDK（会创建全局 supabase 对象） -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="#" class="logo">NetBijak</a>
      <div class="lang-switcher">
        <button data-lang="en">EN</button>
        <button data-lang="zh" class="active">中文</button>
        <button data-lang="ms">BM</button>
      </div>
    </div>
  </nav>

  <!-- 宽屏Banner -->
  <header class="hero">
    <div class="hero-content">
      <h1 id="hero-title">马来西亚最智能的宽带比价</h1>
      <p id="hero-sub">对比所有运营商的配套，找到最适合您的</p>
    </div>
  </header>

  <!-- 配套展示区 -->
  <section class="packages-section">
    <div class="section-header">
      <h2 id="section-title">📡 所有配套</h2>
      <div class="provider-filter">
        <button class="filter-btn active" data-provider="all">全部</button>
        <button class="filter-btn" data-provider="unifi">Unifi</button>
        <button class="filter-btn" data-provider="maxis">Maxis</button>
        <button class="filter-btn" data-provider="time">TIME</button>
        <button class="filter-btn" data-provider="yes">Yes</button>
        <button class="filter-btn" data-provider="umobile">U Mobile</button>
      </div>
    </div>
    <div id="package-grid" class="package-grid"></div>
  </section>

  <footer class="footer">
    <p>© 2026 NetBijak.com · 宽带比价专家</p>
  </footer>

  <!-- 加载主逻辑 -->
  <script src="app.js"></script>
</body>
</html>
