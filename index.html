<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NetBijak · Unifi 宽频比价</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --unifi: #FF6600;
      --bg: #f0f4f8;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .navbar {
      position: sticky; top: 0; z-index: 50;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 0 1rem;
    }
    .navbar-inner {
      max-width: 72rem; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      height: 60px;
    }
    .nav-logo {
      display: flex; align-items: center; gap: 10px;
      color: #fff; font-weight: 800; font-size: 1.05rem; text-decoration: none;
      cursor: pointer;
    }
    .nav-logo-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, #14b8a6, #0ea5e9);
      display: flex; align-items: center; justify-content: center; font-size: 18px;
    }
    .nav-links { display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; }
    .nav-links a {
      color: #94a3b8; text-decoration: none; font-size: 0.875rem; font-weight: 500;
      transition: color 0.2s; cursor: pointer;
    }
    .nav-links a:hover { color: #fff; }
    .nav-links a.active { color: #5eead4; }

    .hero {
      background: linear-gradient(135deg, #0f172a 0%, #1a2744 40%, #0c4a6e 70%, #0f766e 100%);
      color: #fff; position: relative; overflow: hidden;
      padding: 3.5rem 1rem 5rem;
    }
    .hero::before {
      content: ''; position: absolute; inset: 0;
      background-image:
        radial-gradient(circle at 20% 50%, rgba(20,184,166,0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(14,165,233,0.12) 0%, transparent 40%),
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: auto, auto, 40px 40px, 40px 40px;
    }
    .hero-inner { max-width: 72rem; margin: 0 auto; position: relative; z-index: 1; }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(20,184,166,0.2); border: 1px solid rgba(20,184,166,0.4);
      color: #5eead4; font-size: 0.75rem; font-weight: 600;
      padding: 6px 14px; border-radius: 999px; margin-bottom: 1.25rem;
      letter-spacing: 0.05em; text-transform: uppercase;
    }
    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.25rem);
      font-weight: 900; line-height: 1.15; margin-bottom: 1rem;
    }
    .hero h1 span {
      background: linear-gradient(90deg, #5eead4, #38bdf8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-desc { color: #94a3b8; font-size: 1.05rem; max-width: 560px; margin-bottom: 2rem; }
    .stats-bar {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem;
      max-width: 480px;
    }
    .stat-item {
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px; padding: 1rem; text-align: center;
    }
    .stat-num { font-size: 1.75rem; font-weight: 900; color: #5eead4; }
    .stat-label { font-size: 0.7rem; color: #94a3b8; margin-top: 2px; }

    .main { max-width: 72rem; margin: -2.5rem auto 0; padding: 0 1rem 4rem; position: relative; z-index: 2; }
    .section-card {
      background: var(--card); border-radius: 20px;
      box-shadow: 0 4px 24px rgba(15,23,42,0.08), 0 1px 3px rgba(15,23,42,0.06);
      border: 1px solid rgba(226,232,240,0.8);
      padding: 1.75rem; margin-bottom: 2rem;
    }
    @media (min-width: 768px) { .section-card { padding: 2rem 2.25rem; } }
    .section-header { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 1.5rem; }
    .section-icon {
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;
    }
    .section-title { font-size: 1.15rem; font-weight: 800; color: var(--text); }
    .section-sub { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }

    .speed-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 1rem; }
    .speed-card {
      background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 16px;
      padding: 1.5rem 1rem; text-align: center; cursor: pointer;
      transition: all 0.2s;
    }
    .speed-card:hover { border-color: #FF6600; transform: translateY(-4px); box-shadow: 0 8px 20px rgba(255,102,0,0.15); }
    .speed-card .speed-value { font-size: 2rem; font-weight: 900; color: #FF6600; }
    .speed-card .speed-count { font-size: 0.85rem; color: var(--muted); }

    .packages-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.25rem; }
    .pkg-card {
      background: #fff; border-radius: 18px; overflow: hidden;
      border: 2px solid #e2e8f0; display: flex; flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s; position: relative;
    }
    .pkg-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(15,23,42,0.12);
    }
    .pkg-card-header { padding: 1rem 1.25rem 0.75rem; display: flex; align-items: center; gap: 12px; }
    .pkg-card-body { padding: 0 1.25rem 1.25rem; flex: 1; display: flex; flex-direction: column; }
    .pkg-price { font-size: 2rem; font-weight: 900; line-height: 1; margin: 0.5rem 0 0.75rem; }
    .pkg-price small { font-size: 0.8rem; font-weight: 400; color: var(--muted); }
    .pkg-speed-bar { height: 6px; border-radius: 99px; background: #f1f5f9; margin: 0.75rem 0; overflow: hidden; }
    .pkg-speed-fill { height: 100%; border-radius: 99px; transition: width 0.5s ease; background: #FF6600; }
    .best-badge {
      position: absolute; top: 12px; right: 12px;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #fff; font-size: 0.65rem; font-weight: 800;
      padding: 4px 10px; border-radius: 99px; letter-spacing: 0.05em;
    }

    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 99px; font-size: 0.7rem; font-weight: 700;
    }
    .badge-fibre { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }

    .wa-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 13px 20px; margin-top: auto;
      background: linear-gradient(135deg, #25D366, #128C7E);
      color: #fff; border: none; border-radius: 12px;
      font-weight: 700; font-size: 0.875rem; cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .wa-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(37,211,102,0.35); }

    .sort-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .sort-bar select {
      padding: 8px 12px; border-radius: 10px; border: 1px solid #cbd5e1;
      font-size: 0.875rem; background: #fff; cursor: pointer;
    }

    .hidden { display: none !important; }

    footer { text-align: center; padding: 2rem 1rem; border-top: 1px solid #e2e8f0; color: var(--muted); font-size: 0.85rem; background: #fff; }

    @media (max-width: 640px) {
      .nav-links { gap: 0.75rem; }
      .nav-links a { font-size: 0.75rem; }
      .stats-bar { grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
      .stat-num { font-size: 1.25rem; }
      .speed-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a class="nav-logo" onclick="navigate('home')">
        <div class="nav-logo-icon">📡</div>
        NetBijak
      </a>
      <div class="nav-links">
        <a class="active" data-route="home" onclick="navigate('home')">首页</a>
        <a data-route="unifi" onclick="navigate('unifi')">Unifi</a>
        <a data-route="blog" onclick="navigate('blog')">博客</a>
        <a data-route="admin" onclick="navigate('admin')">管理</a>
      </div>
    </div>
  </nav>

  <header class="hero" id="hero-section">
    <div class="hero-inner">
      <div class="hero-badge">✦ 2026 最新 Unifi 配套 · 共 <span id="total-count">0</span> 个方案</div>
      <h1>Unifi 宽频<br><span>一站式比价 · 一键申请</span></h1>
      <p class="hero-desc">马来西亚最大光纤网络运营商 Unifi 全系列配套对比，包含 PrimePromo、Netflix 捆绑、Winback 及升级方案。</p>
      <div class="stats-bar">
        <div class="stat-item"><div class="stat-num" id="total-plans">0</div><div class="stat-label">总配套数</div></div>
        <div class="stat-item"><div class="stat-num">-</div><div class="stat-label">最低月费</div></div>
        <div class="stat-item"><div class="stat-num">-</div><div class="stat-label">最高网速</div></div>
      </div>
    </div>
  </header>

  <main class="main" id="app">
    <div id="page-content"></div>
  </main>

  <footer>
    <p><strong>NetBijak</strong> © 2026 · Unifi 配套比价专家</p>
    <p style="margin-top:4px">数据来源：TM Unifi 官方网站 · 价格仅供参考</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    // ============================================================
    // Supabase 配置（表名是 Plans，大写 P）
    // ============================================================
    const SUPABASE_URL = 'https://yslzoodokunufsgeoazk.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlzbHpvb2Rva3VudWZzZ2VvYXprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0ODgwMTcsImV4cCI6MjEwMjA2NDAxN30.LFQ8KoSfw_2kCDcoYgfLTrmFebEniQ1O5oUS1r2v-lg';
    const TABLE_NAME = 'Plans';   // 注意大写 P

    let allPlans = [];
    let currentRoute = 'home';
    let currentSpeed = null; // '100mbps', '300mbps', etc.

    // ============================================================
    // 初始化 Supabase 客户端
    // ============================================================
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ============================================================
    // 从 Supabase 获取数据
    // ============================================================
    async function fetchPlans() {
      try {
        const { data, error } = await supabase
          .from(TABLE_NAME)
          .select('*')
          .eq('provider', 'Unifi');

        if (error) throw error;
        allPlans = data || [];
        // 更新统计
        document.getElementById('total-count').textContent = allPlans.length;
        document.getElementById('total-plans').textContent = allPlans.length;
        if (allPlans.length > 0) {
          const prices = allPlans.map(p => p.promo_price).filter(p => p !== null && p !== undefined);
          const speeds = allPlans.map(p => parseInt(p.download_speed) || 0);
          document.querySelector('.stat-item:nth-child(2) .stat-num').textContent = 'RM' + Math.min(...prices);
          document.querySelector('.stat-item:nth-child(3) .stat-num').textContent = Math.max(...speeds) + 'Mbps';
        }
        // 渲染当前路由
        renderRoute();
      } catch (err) {
        console.error('Supabase 查询失败:', err);
        // 显示错误提示
        document.getElementById('page-content').innerHTML = `
          <div class="section-card">
            <div style="text-align:center;padding:2rem;color:#ef4444;">
              <h3>⚠️ 数据加载失败</h3>
              <p style="margin-top:0.5rem;color:#64748b;">${err.message}</p>
              <button onclick="fetchPlans()" class="wa-btn" style="max-width:200px;margin:1rem auto;">重试</button>
            </div>
          </div>
        `;
      }
    }

    // ============================================================
    // 路由导航
    // ============================================================
    function navigate(route, speed = null) {
      currentRoute = route;
      currentSpeed = speed;
      // 更新导航高亮
      document.querySelectorAll('.nav-links a').forEach(el => el.classList.remove('active'));
      const navMap = { home: 'home', unifi: 'unifi', blog: 'blog', admin: 'admin' };
      const target = document.querySelector(`.nav-links a[data-route="${route}"]`);
      if (target) target.classList.add('active');
      // 更新 URL hash
      let hash = route;
      if (route === 'unifi' && speed) hash = `unifi/${speed}`;
      window.location.hash = hash;
      renderRoute();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ============================================================
    // 路由渲染
    // ============================================================
    function renderRoute() {
      const container = document.getElementById('page-content');
      if (!container) return;

      // 从 hash 解析路由
      const hash = window.location.hash.replace('#', '') || 'home';
      let route = hash.split('/')[0];
      let speed = hash.split('/')[1] || null;

      // 如果 hash 是 unifi/xxx，则设置 currentRoute 和 currentSpeed
      if (route === 'unifi' && speed) {
        currentRoute = 'unifi';
        currentSpeed = speed;
      } else if (route === 'unifi' && !speed) {
        currentRoute = 'unifi';
        currentSpeed = null;
      } else {
        currentRoute = route;
        currentSpeed = null;
      }

      // 更新导航高亮
      document.querySelectorAll('.nav-links a').forEach(el => el.classList.remove('active'));
      const navMap = { home: 'home', unifi: 'unifi', blog: 'blog', admin: 'admin' };
      const target = document.querySelector(`.nav-links a[data-route="${currentRoute}"]`);
      if (target) target.classList.add('active');

      // 动态 SEO
      updateSEO(currentRoute, currentSpeed);

      // 渲染对应页面
      switch (currentRoute) {
        case 'home': renderHome(container); break;
        case 'unifi': renderUnifi(container, currentSpeed); break;
        case 'blog': renderBlog(container); break;
        case 'admin': renderAdmin(container); break;
        default: renderHome(container);
      }
    }

    // ============================================================
    // SEO 动态更新
    // ============================================================
    function updateSEO(route, speed) {
      const titles = {
        home: 'NetBijak · Unifi 宽频一站式比价平台',
        unifi: speed ? `Unifi ${speed.toUpperCase()} 配套对比 · NetBijak` : 'Unifi 全系列配套对比 · NetBijak',
        blog: 'NetBijak 博客 · 宽频资讯与指南',
        admin: 'NetBijak 后台管理'
      };
      const descs = {
        home: '对比 Unifi 全系列宽频配套，一键 WhatsApp 申请。覆盖 100Mbps 至 2Gbps，含 PrimePromo、Netflix 捆绑、Winback 方案。',
        unifi: speed ? `对比 Unifi ${speed.toUpperCase()} 所有优惠方案，包含新申请、升级、Winback 等。` : 'Unifi 全系列配套对比，价格、速度、合约一目了然。',
        blog: '最新宽频资讯、申请指南、优惠解读。',
        admin: 'NetBijak 内容管理后台。'
      };
      const keywords = {
        home: 'Unifi, 宽频, 马来西亚, 光纤, 比价',
        unifi: speed ? `Unifi ${speed.toUpperCase()}, 宽频, 马来西亚, 光纤` : 'Unifi, 宽频, 比价, 马来西亚',
        blog: '宽频, 资讯, 指南',
        admin: ''
      };

      let title = titles[route] || 'NetBijak';
      let desc = descs[route] || '';
      let kw = keywords[route] || '';

      document.title = title;
      let metaDesc = document.querySelector('meta[name="description"]');
      if (!metaDesc) { metaDesc = document.createElement('meta'); metaDesc.name = 'description'; document.head.appendChild(metaDesc); }
      metaDesc.content = desc;

      let metaKw = document.querySelector('meta[name="keywords"]');
      if (!metaKw) { metaKw = document.createElement('meta'); metaKw.name = 'keywords'; document.head.appendChild(metaKw); }
      metaKw.content = kw;
    }

    // ============================================================
    // 首页
    // ============================================================
    function renderHome(container) {
      container.innerHTML = `
        <div class="section-card">
          <div class="section-header">
            <div class="section-icon" style="background:#fef3c7">🏠</div>
            <div>
              <div class="section-title">欢迎来到 NetBijak</div>
              <div class="section-sub">马来西亚最智能的 Unifi 宽频比价平台</div>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;">
            <div class="speed-card" onclick="navigate('unifi','100mbps')">
              <div class="speed-value">100</div>
              <div class="speed-count">Mbps · 查看配套 →</div>
            </div>
            <div class="speed-card" onclick="navigate('unifi','300mbps')">
              <div class="speed-value">300</div>
              <div class="speed-count">Mbps · 查看配套 →</div>
            </div>
            <div class="speed-card" onclick="navigate('unifi','500mbps')">
              <div class="speed-value">500</div>
              <div class="speed-count">Mbps · 查看配套 →</div>
            </div>
            <div class="speed-card" onclick="navigate('unifi','1gbps')">
              <div class="speed-value">1G</div>
              <div class="speed-count">bps · 查看配套 →</div>
            </div>
            <div class="speed-card" onclick="navigate('unifi','2gbps')">
              <div class="speed-value">2G</div>
              <div class="speed-count">bps · 查看配套 →</div>
            </div>
          </div>
        </div>
        <div class="section-card">
          <div class="section-header">
            <div class="section-icon" style="background:#ede9fe">📊</div>
            <div>
              <div class="section-title">快速比价总览</div>
              <div class="section-sub">点击速度分类进入详细对比</div>
            </div>
          </div>
          <div class="table-wrap" style="overflow-x:auto;">
            <table style="width:100%;border-collapse:collapse;font-size:0.875rem;">
              <thead><tr style="background:#0f172a;color:#fff;"><th style="padding:10px 12px;text-align:left;">配套名称</th><th style="padding:10px 12px;text-align:left;">速度</th><th style="padding:10px 12px;text-align:right;">月费</th></tr></thead>
              <tbody>
                ${allPlans.slice(0,10).map(p => `<tr style="border-bottom:1px solid #f1f5f9;"><td style="padding:8px 12px;">${p.name}</td><td style="padding:8px 12px;">${p.download_speed}</td><td style="padding:8px 12px;text-align:right;font-weight:700;color:#FF6600;">RM${p.promo_price}</td></tr>`).join('')}
                ${allPlans.length > 10 ? `<tr><td colspan="3" style="padding:8px 12px;text-align:center;color:#94a3b8;">... 还有 ${allPlans.length - 10} 个配套，点击上方分类查看全部</td></tr>` : ''}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // ============================================================
    // Unifi 子页面（根据速度筛选）
    // ============================================================
    function renderUnifi(container, speed) {
      let filtered = allPlans;
      let title = '所有配套';
      if (speed) {
        const speedNum = parseInt(speed);
        filtered = allPlans.filter(p => {
          const pSpeed = parseInt(p.download_speed);
          return pSpeed === speedNum;
        });
        title = `${speed.toUpperCase()} 配套 (${filtered.length} 个)`;
      }

      // 排序选项
      const sortOptions = `
        <div class="sort-bar">
          <span style="font-size:0.875rem;color:var(--muted)">排序：</span>
          <select id="unifi-sort" onchange="renderUnifi(document.getElementById('page-content'), '${speed || ''}')">
            <option value="price-asc">价格：低到高 ↑</option>
            <option value="price-desc">价格：高到低 ↓</option>
            <option value="speed-desc">速度：快到慢 ↓</option>
          </select>
        </div>
      `;

      const sortVal = document.getElementById('unifi-sort')?.value || 'price-asc';
      const sorted = [...filtered];
      if (sortVal === 'price-asc') sorted.sort((a,b) => a.promo_price - b.promo_price);
      else if (sortVal === 'price-desc') sorted.sort((a,b) => b.promo_price - a.promo_price);
      else if (sortVal === 'speed-desc') sorted.sort((a,b) => (parseInt(b.download_speed)||0) - (parseInt(a.download_speed)||0));

      // 生成卡片
      const cards = sorted.map(p => {
        const featureList = p.features ? p.features.split(',').map(f => f.trim()).filter(f => f) : [];
        const isLowest = p.promo_price === Math.min(...filtered.map(pp => pp.promo_price));
        const speedNum = parseInt(p.download_speed) || 100;
        const pct = Math.min(100, (speedNum / 2000) * 100);
        return `
          <div class="pkg-card">
            ${isLowest ? '<div class="best-badge">💰 最低价</div>' : ''}
            <div style="height:5px;background:#FF6600;"></div>
            <div class="pkg-card-header">
              <div style="font-weight:800;font-size:1.1rem;color:#FF6600;">Unifi</div>
            </div>
            <div class="pkg-card-body">
              <div style="font-weight:700;font-size:1rem;">${p.name}</div>
              ${p.tagline ? `<div style="font-size:0.8rem;color:#f59e0b;font-weight:600;">${p.tagline}</div>` : ''}
              <div class="pkg-price">RM${p.promo_price}<small>/月</small></div>
              <div class="pkg-speed-bar"><div class="pkg-speed-fill" style="width:${pct}%;"></div></div>
              <div style="display:flex;flex-wrap:wrap;gap:6px;margin:0.5rem 0;">
                <span class="badge badge-fibre">🔌 Unifi Fibre</span>
                <span class="badge" style="background:#fef3c7;color:#b45309;border:1px solid #fcd34d;">${p.new_and_transfer || 'Standard'}</span>
              </div>
              <div style="font-size:0.8rem;color:#64748b;display:flex;justify-content:space-between;">
                <span>速度</span><strong>${p.download_speed}</strong>
              </div>
              <div style="font-size:0.8rem;color:#64748b;display:flex;justify-content:space-between;margin-bottom:0.5rem;">
                <span>合约</span><strong>${p.contract_months} 个月</strong>
              </div>
              ${featureList.length > 0 ? `<ul style="font-size:0.75rem;color:#475569;list-style:disc;padding-left:1.2rem;margin-bottom:0.75rem;">${featureList.slice(0,3).map(f => `<li>${f}</li>`).join('')}</ul>` : ''}
              <button class="wa-btn" onclick="openWhatsApp('${encodeURIComponent(p.whatsapp_ref || 'Hi NetBijak, I want to apply this package.')}')">💬 WhatsApp 询价</button>
            </div>
          </div>
        `;
      }).join('');

      container.innerHTML = `
        <div class="section-card">
          <div class="section-header">
            <div class="section-icon" style="background:#e0f2fe;">📡</div>
            <div>
              <div class="section-title">${title}</div>
              <div class="section-sub">点击配套上的 WhatsApp 按钮，一键咨询申请</div>
            </div>
            ${sortOptions}
          </div>
          <div class="packages-grid">${cards}</div>
        </div>
        <!-- 返回链接 -->
        <div style="text-align:center;margin-top:1rem;">
          <a onclick="navigate('unifi')" style="color:#FF6600;cursor:pointer;font-weight:600;">← 返回 Unifi 总览</a>
        </div>
      `;
    }

    // ============================================================
    // 博客（占位）
    // ============================================================
    function renderBlog(container) {
      container.innerHTML = `
        <div class="section-card">
          <div class="section-header">
            <div class="section-icon" style="background:#ccfbf1;">📝</div>
            <div>
              <div class="section-title">NetBijak 博客</div>
              <div class="section-sub">宽频资讯、申请指南、优惠解读</div>
            </div>
          </div>
          <p style="color:#64748b;text-align:center;padding:2rem;">博客功能即将上线，敬请期待。<br>您将能发布文章、设置 SEO 和定时发布。</p>
        </div>
      `;
    }

    // ============================================================
    // 后台管理（占位）
    // ============================================================
    function renderAdmin(container) {
      container.innerHTML = `
        <div class="section-card">
          <div class="section-header">
            <div class="section-icon" style="background:#fce4ec;">🔐</div>
            <div>
              <div class="section-title">后台管理</div>
              <div class="section-sub">管理配套、文章、客户</div>
            </div>
          </div>
          <p style="color:#64748b;text-align:center;padding:2rem;">后台功能开发中，将支持：<br>✅ 配套增删改（含定时发布）<br>✅ 文章发布（含 SEO、GEO）<br>✅ 客户与合约管理</p>
        </div>
      `;
    }

    // ============================================================
    // WhatsApp 按钮
    // ============================================================
    function openWhatsApp(msg) {
      const phone = '60123456789';  // 请替换为您的 WhatsApp 号码
      window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
    }

    // ============================================================
    // 监听 hash 变化
    // ============================================================
    window.addEventListener('hashchange', () => {
      renderRoute();
    });

    // ============================================================
    // 初始化
    // ============================================================
    fetchPlans();
  </script>
</body>
</html>
