<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NetBijak.com | Bandingkan Pelan Jalur Lebar Malaysia</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="canonical" href="https://netbijak.com/ms/" />
  <link rel="alternate" hreflang="en" href="https://netbijak.com/en/" />
  <link rel="alternate" hreflang="zh" href="https://netbijak.com/zh/" />
  <link rel="alternate" hreflang="ms" href="https://netbijak.com/ms/" />
  <link rel="alternate" hreflang="x-default" href="https://netbijak.com/en/" />
  <script src="../assets/js/seo-meta.js"></script>
  <script>const ROOT_PATH = "../";</script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "NetBijak",
    "url": "https://netbijak.com/",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://netbijak.com/en/blog/?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "NetBijak",
    "url": "https://netbijak.com/",
    "logo": "https://netbijak.com/assets/images/logo.png",
    "description": "Malaysia's broadband comparison platform."
  }
  </script>
</head>
<body>
  <div id="site-header"></div>

  <main class="main">
    <div class="home-hero">
      <h1 id="home-title"></h1>
      <p id="home-subtitle"></p>
    </div>

    <section class="section-card">
      <div class="search-box-row">
        <input type="text" id="search-input" />
        <button id="search-btn" class="search-btn">🔍</button>
      </div>
      <div class="icon-nav-grid">
        <a href="broadband-home/" class="icon-nav-item">
          <div class="icon-nav-circle">🏠</div>
          <span id="icon-nav-home-label"></span>
        </a>
        <a href="broadband-business/" class="icon-nav-item">
          <div class="icon-nav-circle">💼</div>
          <span id="icon-nav-business-label"></span>
        </a>
        <a href="find-your-plan/" class="icon-nav-item">
          <div class="icon-nav-circle">🎯</div>
          <span id="icon-nav-findplan-label"></span>
        </a>
        <a href="compare/" class="icon-nav-item">
          <div class="icon-nav-circle">⚖️</div>
          <span id="icon-nav-compare-label"></span>
        </a>
        <a href="speedtest/" class="icon-nav-item">
          <div class="icon-nav-circle">⚡</div>
          <span id="icon-nav-speedtest-label"></span>
        </a>
        <a href="blog/" class="icon-nav-item">
          <div class="icon-nav-circle">📰</div>
          <span id="icon-nav-blog-label"></span>
        </a>
      </div>
    </section>

    <section class="section-card" id="latest-articles-section">
      <div class="latest-articles-header">
        <h2 id="latest-articles-title" style="margin-bottom:0"></h2>
        <div class="latest-articles-controls">
          <button type="button" id="latest-articles-prev" class="btn-scroll">‹</button>
          <button type="button" id="latest-articles-next" class="btn-scroll">›</button>
          <a href="blog/" id="latest-articles-all" class="latest-articles-all-link"></a>
        </div>
      </div>
<div id="latest-articles-track" class="latest-articles-track"><!--SSG:articles--><!--/SSG:articles--></div>
    </section>

    <section class="section-card">
      <h2 id="browse-title"></h2>
<div id="provider-browse-grid" class="provider-browse-grid"><!--SSG:providers--><!--/SSG:providers--></div>
    </section>

    <section class="section-card">
      <h2 id="faq-title"></h2>
      <p class="section-sub" id="faq-subtitle"></p>
<div id="faq-list" class="faq-list"><!--SSG:homefaq--><!--/SSG:homefaq--></div>
    </section>

    <section id="results-section" class="section-card hidden">
      <h2 id="results-title"></h2>
      <p class="section-sub" id="results-sub"></p>
      <div id="results-grid" class="results-grid"></div>
    </section>
  </main>

  <footer id="site-footer"></footer>

<script src="../assets/js/static-data.js"></script>
  <script src="../assets/js/translations.js"></script>
  <script src="../assets/js/site.js"></script>
  <script src="../assets/js/home.js"></script>
  <script src="../assets/js/faq.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("home-title").textContent = t("home_title");
      document.getElementById("home-subtitle").textContent = t("home_subtitle");
      document.getElementById("search-input").placeholder = t("search_placeholder");
      document.getElementById("icon-nav-home-label").textContent = t("icon_broadband_home");
      document.getElementById("icon-nav-business-label").textContent = t("icon_broadband_business");
      document.getElementById("icon-nav-findplan-label").textContent = t("icon_find_plan");
      document.getElementById("icon-nav-compare-label").textContent = t("icon_compare");
      document.getElementById("icon-nav-speedtest-label").textContent = t("icon_speedtest");
      document.getElementById("icon-nav-blog-label").textContent = t("icon_articles");
      document.getElementById("latest-articles-title").textContent = t("latest_articles_title");
      document.getElementById("latest-articles-all").textContent = t("latest_articles_all");
      document.getElementById("browse-title").textContent = t("browse_by_provider");
      document.getElementById("results-title").textContent = t("results_title");
      document.getElementById("results-sub").textContent = t("results_sub");
    });
  </script>
</body>
</html>
