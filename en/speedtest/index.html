<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Internet Speed Test | NetBijak.com</title>
  <meta name="description" content="Test your internet download, upload speed and ping for free. Compare Malaysia broadband plans if you're not satisfied." />
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Speed Test - NetBijak",
    "applicationCategory": "UtilitiesApplication",
    "operatingSystem": "Web",
    "url": "https://netbijak.com/en/speedtest/",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "MYR"
    },
    "description": "Free internet speed test tool to check your download, upload speed and ping."
  }
  </script>
</head>
<body>
  <div id="site-header"></div>

  <main class="main">
    <div class="speedtest-hero">
      <h1 id="st-title"></h1>
      <p id="st-subtitle"></p>
    </div>

    <div class="speedtest-widget-wrap">
      <iframe src="https://openspeedtest.com/speedtest" width="100%" height="500" frameborder="0" style="border-radius:14px"></iframe>
    </div>

    <div class="speedtest-cta">
      <p id="st-cta"></p>
      <a href="../" class="btn-primary" id="st-cta-btn"></a>
    </div>
  </main>

  <footer id="site-footer"></footer>

<script>const ROOT_PATH = "../../";</script>
  <script src="../../assets/js/translations.js"></script>
  <script src="../../assets/js/site.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("st-title").textContent = t("speedtest_title");
      document.getElementById("st-subtitle").textContent = t("speedtest_subtitle");
      document.getElementById("st-cta").textContent = t("speedtest_cta");
      document.getElementById("st-cta-btn").textContent = t("speedtest_cta_btn");
    });
  </script>
</body>
</html>
