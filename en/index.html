<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NetBijak.com | Compare Malaysia Broadband Plans</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>const ROOT_PATH = "../";</script>
</head>
<body>
  <div id="site-header"></div>

  <main class="main">
    <div class="home-hero">
      <h1 id="home-title"></h1>
      <p id="home-subtitle"></p>
    </div>

    <section class="section-card">
      <div class="search-box-row">
        <input type="text" id="search-input" />
        <button id="search-btn" class="search-btn">🔍</button>
      </div>
      <div class="icon-nav-grid">
        <a href="broadband-home/" class="icon-nav-item">
          <div class="icon-nav-circle">🏠</div>
          <span id="icon-nav-home-label"></span>
        </a>
        <a href="broadband-business/" class="icon-nav-item">
          <div class="icon-nav-circle">💼</div>
          <span id="icon-nav-business-label"></span>
        </a>
        <a href="speedtest/" class="icon-nav-item">
          <div class="icon-nav-circle">⚡</div>
          <span id="icon-nav-speedtest-label"></span>
        </a>
        <a href="blog/" class="icon-nav-item">
          <div class="icon-nav-circle">📰</div>
          <span id="icon-nav-blog-label"></span>
        </a>
      </div>
    </section>

    <section class="section-card" id="usage-section">
      <h2 id="usage-title"></h2>
      <div class="property-grid">
        <button id="btn-usage-home" class="property-btn active">
          <div class="property-icon">🏠</div>
          <div>
            <div class="property-name" id="usage-home-name"></div>
            <div class="property-desc" id="usage-home-desc"></div>
          </div>
        </button>
        <button id="btn-usage-business" class="property-btn">
          <div class="property-icon">💼</div>
          <div>
            <div class="property-name" id="usage-business-name"></div>
            <div class="property-desc" id="usage-business-desc"></div>
          </div>
        </button>
      </div>
    </section>

    <section class="section-card">
      <h2 id="property-title"></h2>
      <p class="section-sub" id="property-sub"></p>
      <div class="property-grid">
        <button id="btn-landed" class="property-btn">
          <div class="property-icon">🏡</div>
          <div>
            <div class="property-name" id="property-landed-name"></div>
            <div class="property-desc" id="property-landed-desc"></div>
          </div>
        </button>
        <button id="btn-highrise" class="property-btn active">
          <div class="property-icon">🏢</div>
          <div>
            <div class="property-name" id="property-highrise-name"></div>
            <div class="property-desc" id="property-highrise-desc"></div>
          </div>
        </button>
      </div>
    </section>

    <section class="section-card">
      <div class="form-row">
        <label id="apptype-title"></label>
        <select id="apptype-select">
          <option value="new" selected id="apptype-opt-new"></option>
          <option value="transfer" id="apptype-opt-transfer"></option>
          <option value="upgrade" id="apptype-opt-upgrade"></option>
          <option value="existing" id="apptype-opt-existing"></option>
        </select>
      </div>
      <div class="form-row">
        <label id="users-title"></label>
        <select id="user-select">
          <option value="1-2">1 - 2</option>
          <option value="2-4" selected>2 - 4</option>
          <option value="4-6">4 - 6</option>
          <option value="6-8">6 - 8</option>
          <option value="8-10">8 - 10+</option>
        </select>
      </div>
      <div class="form-row">
        <label id="budget-title"></label>
        <input type="number" id="budget-input" placeholder="150" />
      </div>
      <button id="btn-compare" class="btn-primary"></button>
    </section>

    <section id="results-section" class="section-card hidden">
      <h2 id="results-title"></h2>
      <p class="section-sub" id="results-sub"></p>
      <div id="results-grid" class="results-grid"></div>
    </section>

    <section class="section-card">
      <h2 id="browse-title"></h2>
      <div id="provider-browse-grid" class="provider-browse-grid"></div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/translations.js"></script>
  <script src="../assets/js/site.js"></script>
  <script src="../assets/js/home.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("home-title").textContent = t("home_title");
      document.getElementById("home-subtitle").textContent = t("home_subtitle");
      document.getElementById("search-input").placeholder = t("search_placeholder");
      document.getElementById("icon-nav-home-label").textContent = t("icon_broadband_home");
      document.getElementById("icon-nav-business-label").textContent = t("icon_broadband_business");
      document.getElementById("icon-nav-speedtest-label").textContent = t("icon_speedtest");
      document.getElementById("icon-nav-blog-label").textContent = t("icon_articles");
      document.getElementById("usage-title").textContent = t("section_usage_title");
      document.getElementById("usage-home-name").textContent = t("usage_home");
      document.getElementById("usage-home-desc").textContent = t("usage_home_desc");
      document.getElementById("usage-business-name").textContent = t("usage_business");
      document.getElementById("usage-business-desc").textContent = t("usage_business_desc");
      document.getElementById("property-title").textContent = t("section_property_title");
      document.getElementById("property-sub").textContent = t("section_property_sub");
      document.getElementById("property-landed-name").textContent = t("property_landed");
      document.getElementById("property-landed-desc").textContent = t("property_landed_desc");
      document.getElementById("property-highrise-name").textContent = t("property_highrise");
      document.getElementById("property-highrise-desc").textContent = t("property_highrise_desc");
      document.getElementById("apptype-title").textContent = t("section_apptype_title");
      document.getElementById("apptype-opt-new").textContent = t("apptype_new");
      document.getElementById("apptype-opt-transfer").textContent = t("apptype_transfer");
      document.getElementById("apptype-opt-upgrade").textContent = t("apptype_upgrade");
      document.getElementById("apptype-opt-existing").textContent = t("apptype_existing");
      document.getElementById("users-title").textContent = t("section_users_title");
      document.getElementById("budget-title").textContent = t("section_budget_title");
      document.getElementById("budget-input").placeholder = t("budget_placeholder");
      document.getElementById("btn-compare").textContent = t("btn_compare");
      document.getElementById("browse-title").textContent = t("browse_by_provider");
      document.getElementById("results-title").textContent = t("results_title");
      document.getElementById("results-sub").textContent = t("results_sub");
    });
  </script>
</body>
</html>
